version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cryptoalerts-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=cryptoalerts
    volumes:
      - mongo_data:/data/db
    networks:
      - cryptoalerts-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cryptoalerts-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI (http://localhost:15672)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cryptoalerts-net

volumes:
  mongo_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  cryptoalerts-net:
    driver: bridge
